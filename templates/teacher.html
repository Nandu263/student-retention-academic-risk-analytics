<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
</head>
<body>
    <h1>Teacher Dashboard</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Attendance</th>
            <th>Marks</th>
            <th>Assignments</th>
            <th>Study Hours</th>
            <th>Risk</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.attendance }}</td>
            <td>{{ s.marks }}</td>
            <td>{{ s.assignments }}</td>
            <td>{{ s.study_hours }}</td>
            <td>{{ s.risk }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Logout</a>
</body>
</html>
